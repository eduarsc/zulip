name: zulip-development

x-proxy-environment: &proxy-environment
  HTTP_PROXY: "${PROXY_URL-http://128.0.205.252:3128}"
  HTTPS_PROXY: "${PROXY_URL-http://128.0.205.252:3128}"
  NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,zulipdev.com,.zulipdev.com}"
  http_proxy: "${PROXY_URL-http://128.0.205.252:3128}"
  https_proxy: "${PROXY_URL-http://128.0.205.252:3128}"
  no_proxy: "${NO_PROXY:-localhost,127.0.0.1,::1,zulipdev.com,.zulipdev.com}"

services:
  zulip:
    build:
      context: tools/setup/dev-vagrant-docker
      args:
        <<: *proxy-environment
        VAGRANT_UID: "1000"
        UBUNTU_MIRROR: "${UBUNTU_MIRROR:-}"
    init: true
    stdin_open: true
    tty: true
    ulimits:
      nofile:
        soft: 1024
        hard: 65536
    environment:
      <<: *proxy-environment
      UBUNTU_MIRROR: "${UBUNTU_MIRROR:-}"
      ZULIP_PATH: /workspace/zulip
    ports:
      - "127.0.0.1:${HOST_PORT:-9991}:9991"
      - "127.0.0.1:${WEBPACK_PORT:-9994}:9994"
      - "127.0.0.1:${HELP_CENTER_PORT:-9995}:9995"
    volumes:
      - .:/workspace/zulip
    working_dir: /workspace/zulip
    entrypoint: /workspace/zulip/tools/setup/dev-compose/entrypoint
    stop_grace_period: 30s
